[package]
name = "ecpilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MSI laptop control center rewritten with Rust and GPUI"
license = "GPL-3.0-or-later"

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.12" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["ioctl", "poll", "fs", "signal", "user"] }
zbus = { version = "5", features = ["blocking"] }
ksni = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }


[profile.release]
opt-level = 2

[[bin]]
name = "ecpilot-helper"
path = "src/bin/helper.rs"
