<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <policy user="root">
        <allow own="ecpilot.helper"/>
        <allow send_destination="ecpilot.helper"/>
        <allow receive_sender="ecpilot.helper"/>
    </policy>
    <policy group="wheel">
        <allow send_destination="ecpilot.helper"/>
        <allow receive_sender="ecpilot.helper"/>
    </policy>
</busconfig>
